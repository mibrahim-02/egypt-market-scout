<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF8FAB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="bkam y 3mo" />
  <meta name="description" content="bkam y 3mo — بكام يا عمّو. Compare prices across Egyptian stores. قولي المنتج وهي تسألك بكام." />
  <title>بكام يا عمّو · bkam y 3mo</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="sparkles" aria-hidden="true"></div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="./icon.png" alt="" class="logo" />
        <div>
          <h1 data-i18n="title">بكام يا عمّو</h1>
          <p class="tag" data-i18n="franco">bkam y 3mo</p>
        </div>
      </div>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">EN</button>
    </header>

    <section class="hero">
      <img class="mascot" src="./mascot.png" alt="" />
      <div class="speech">
        <p class="ask" data-i18n="ask">بكام يا عمّو؟</p>
        <p class="ask-sub" data-i18n="askSub">قولي هتشتري إيه… وأنا أسأل السوق كله</p>
      </div>
    </section>

    <form class="search-card" id="searchForm">
      <label for="q" data-i18n="searchLabel">هتشتري إيه؟</label>
      <div class="search-row">
        <div class="suggest-wrap">
          <input
            id="q"
            name="q"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="suggestList"
            data-i18n-placeholder="placeholder"
            placeholder="ايفون 15 أو air fryer"
            required
          />
          <ul id="suggestList" class="suggest-list" role="listbox" hidden></ul>
        </div>
        <button type="submit" id="searchBtn" data-i18n="search">يلا</button>
      </div>
      <p class="hint" data-i18n="hint">عربي أو إنجليزي. جوميا، أمازون مصر، نون، بي تك، تو بي، رنين وكارفور.</p>
    </form>

    <section class="categories">
      <h2 data-i18n="categoriesTitle">الأقسام</h2>
      <div class="category-grid">
        <button type="button" class="category-card" data-cat="skincare">
          <span class="category-emoji">🧴</span>
          <span class="category-name" data-i18n="catSkin">Skin Care</span>
          <span class="category-sub" data-i18n="catSkinSub">سيرم، غسول، كريم</span>
        </button>
        <button type="button" class="category-card" data-cat="fashion">
          <span class="category-emoji">👗</span>
          <span class="category-name" data-i18n="catFashion">Fashion</span>
          <span class="category-sub" data-i18n="catFashionSub">لبس، شنط، شوز</span>
        </button>
      </div>
    </section>

    <section class="status" id="status" hidden></section>
    <section class="summary" id="summary" hidden></section>
    <section class="toolbar" id="toolbar" hidden>
      <div class="sorts">
        <button type="button" class="chip active" data-sort="price">السعر</button>
        <button type="button" class="chip" data-sort="rating">التقييم</button>
        <button type="button" class="chip" data-sort="reviews">عدد المراجعات</button>
      </div>
    </section>
    <section class="results" id="results"></section>

    <footer class="foot">
      <p data-i18n="disclaimer">الأسعار من نتائج عامة داخل مصر. أكّدي في المتجر قبل الشراء.</p>
      <p class="add-home" data-i18n="addHome">على الآيفون: Safari ← مشاركة ← إضافة إلى الشاشة الرئيسية</p>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
